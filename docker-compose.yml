services:
  log-analyzer:
    build:
      context: ./services/log-analyzer
      dockerfile: Dockerfile
    image: log-analyzer:latest
    container_name: log-analyzer
    env_file:
      - .env
    command: ["uvicorn", "log_analyzer:app", "--host", "0.0.0.0", "--port", "${PORT:-7000}"]
    ports:
      - "${PORT:-7000}:${PORT:-7000}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:$PORT/health"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 10s

  knowledge-copilot:
    build:
      context: ./services/knowledge-copilot
      dockerfile: Dockerfile
    image: knowledge-copilot:latest
    container_name: knowledge-copilot
    env_file:
      - .env
    # Single worker: two would race two alert-sync loops on the same writes.
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "${COPILOT_PORT:-7100}"]
    ports:
      # Loopback only; nginx terminates TLS on this host and proxies to it.
      - "127.0.0.1:${COPILOT_PORT:-7100}:${COPILOT_PORT:-7100}"
    # Bind mounts keep the host uid. Override in .env if `id -u` is not 1000.
    user: "${KC_UID:-1000}:${KC_GID:-1000}"
    volumes:
      - ./services/knowledge-copilot/corpus:/app/corpus:ro
      - ./services/knowledge-copilot/chroma_data:/app/chroma_data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:$COPILOT_PORT/health"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 10s

  self-healing-agent:
    build:
      context: ./services/self-healing-agent
      dockerfile: Dockerfile
    image: self-healing-agent:latest
    container_name: self-healing-agent
    env_file:
      - .env
    # --workers 1: approvals._proposals is in-process, so a second worker would reject a
    # valid Slack Approve.
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "${SHA_PORT:-7200}", "--workers", "1"]
    ports:
      - "127.0.0.1:${SHA_PORT:-7200}:${SHA_PORT:-7200}"
    user: "${SHA_UID:-1000}:${SHA_GID:-1000}"
    volumes:
      # The audit log is a safety control and has to outlive the container.
      - ./services/self-healing-agent/audit:/app/audit
      # - ${KUBECONFIG:-~/.kube/config}:/home/appuser/.kube/config:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:$SHA_PORT/health"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 10s

  security-triage:
    build:
      context: ./services/security-triage
      dockerfile: Dockerfile
    image: security-triage:latest
    container_name: security-triage
    env_file:
      - .env
    # --workers 1: _runs, _starts and the Prometheus registry are all process-local.
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "${ST_PORT:-7300}", "--workers", "1"]
    ports:
      - "127.0.0.1:${ST_PORT:-7300}:${ST_PORT:-7300}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:${ST_PORT:-7300}/health"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 10s

  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    image: gateway:latest
    container_name: gateway
    env_file:
      - .env
    # --workers 1: _starts and the Prometheus registry are process-local.
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "${GW_PORT:-7500}", "--workers", "1"]
    ports:
      - "127.0.0.1:${GW_PORT:-7500}:${GW_PORT:-7500}"
    # No depends_on: the gateway is correct with every backend down, and /health is what
    # reports which are missing.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:${GW_PORT:-7500}/health"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 10s
