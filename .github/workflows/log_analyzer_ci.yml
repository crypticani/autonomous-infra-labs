name: Log Analyzer CI

on:
  push:
    branches: ["main"]
    paths:
      - 'services/log-analyzer/**'
    pull_request:
      branches: ["main"]
      paths:
        - 'services/log-analyzer/**'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/log-analyzer/requirements.txt
          pip install pytest black httpx
      
      - name: Run Linting
        run: |
          black --check services/log-analyzer
          flake8 services/log-analyzer
      
  build-and-push:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
      
      - name: Log in to Github Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./services/log-analyzer
          push: true
          tags: ghcr.io/${{ github.repository }}/log-analyzer:${{ github.sha }}
