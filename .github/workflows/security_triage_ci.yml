name: Security Triage CI

on:
  push:
    branches: ["main"]
    paths:
      - 'services/security-triage/**'
  pull_request:
    branches: ["main"]
    paths:
      - 'services/security-triage/**'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/security-triage/requirements.txt

      - name: Run Linting
        run: |
          black --check services/security-triage

      - name: Run Tests
        working-directory: services/security-triage
        run: python -m pytest tests/ -q

      - name: Check scan.sh
        # Runs on every onboarded repo's runner, so a syntax error breaks their CI.
        run: bash -n services/security-triage/scan.sh

      - name: Check the cross-service eval runner
        # No service's tests cover the repo-root runner. Catches a renamed eval script,
        # which would otherwise be a permanently empty column in the table.
        run: python eval_all.py --selftest

  validate-manifests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.4.0/kubeconform-linux-amd64.tar.gz \
            | tar xz kubeconform && sudo mv kubeconform /usr/local/bin/

      - name: Validate Kubernetes Manifests
        run: kubeconform -strict -summary services/security-triage/k8s/

  build-and-push:
    needs: [lint-and-test, validate-manifests]
    # Load-bearing: without it the `pull_request` trigger publishes :latest from
    # unmerged code, and this image holds every onboarded repo's API token at runtime.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Log in to Github Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Qemu and Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./services/security-triage
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository }}/security-triage:latest
