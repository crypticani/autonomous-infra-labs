name: Knowledge Copilot CI

on:
  push:
    branches: ["main"]
    paths:
      - 'services/knowledge-copilot/**'
    pull_request:
      branches: ["main"]
      paths:
        - 'services/knowledge-copilot/**'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/knowledge-copilot/requirements.txt
          pip install pytest httpx

      - name: Run Linting
        run: |
          black --check services/knowledge-copilot

      - name: Run Tests
        working-directory: services/knowledge-copilot
        run: python -m pytest tests/ -q

  build-and-push:
    needs: [lint-and-test]
    # A no-op while `pull_request` sits nested under `push:` above and never fires. It
    # is here so that fixing that indentation cannot, on its own, start publishing
    # :latest from unmerged pull-request code.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Log in to Github Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Qemu and Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./services/knowledge-copilot
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository }}/knowledge-copilot:latest
