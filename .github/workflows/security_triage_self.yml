# This repo eating its own dog food -- the same ~15 lines any other repo copies, and it
# knows nothing about how triage works.
#
# Skipped, not failed, until `vars.SECURITY_TRIAGE_ENDPOINT` is set: a red X on every PR
# is how a check gets ignored forever. Setting the variable and secret turns it on.
name: Security Triage (self)

on:
  pull_request:
    branches: ["main"]

jobs:
  triage:
    if: vars.SECURITY_TRIAGE_ENDPOINT != ''
    uses: ./.github/workflows/security-triage.yml
    # A fork PR gets a read-only token regardless, so the comment fails and the gate
    # still runs. Not worked around with `pull_request_target`, which would hand a
    # writable token to a fork's code.
    permissions:
      pull-requests: write
    with:
      endpoint: ${{ vars.SECURITY_TRIAGE_ENDPOINT }}
      # Higher than the shipped default of 40: this tree's findings are dominated by a
      # sandbox cluster and hygiene rules. A placeholder until a real run produces one.
      risk-threshold: '60'
      # Local, so a change to scan.sh is exercised by the PR that makes it.
      triage-ref: ${{ github.event.pull_request.head.sha }}
    secrets:
      api_token: ${{ secrets.SECURITY_TRIAGE_TOKEN }}
