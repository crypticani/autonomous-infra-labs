# Reusable: any repo calls this with a URL and a token. Scanners run on the caller's
# runner over the caller's checkout -- findings come to the service, code never does.
#
# Every `${{ }}` is bound to an `env:` var rather than pasted into a `run:` body. One
# rule for the whole file is how it stays true after the next edit.
name: Security Triage

on:
  workflow_call:
    inputs:
      endpoint:
        description: 'Base URL of the security-triage service, no trailing slash.'
        required: true
        type: string
      risk-threshold:
        description: >-
          Score at or above which this repo fails its build, 0-100. Empty means "use the
          service default". A string, so "unset" and the legal bar "0" stay different.
        required: false
        type: string
        default: ''
      scan-path:
        description: 'Directory to scan, relative to the checkout.'
        required: false
        type: string
        default: '.'
      triage-repo:
        description: >-
          Where scan.sh is fetched from. Vendoring a copy would let each onboarded repo
          drift from the parser that reads its output.
        required: false
        type: string
        default: 'crypticani/autonomous-infra-labs'
      triage-ref:
        description: 'Ref of triage-repo to take scan.sh from. Pin to a tag for reproducible scans.'
        required: false
        type: string
        default: 'main'
      poll-timeout-minutes:
        description: >-
          How long to wait for the verdict. One model call per batch on a CPU backend, so
          minutes is normal.
        required: false
        type: number
        default: 45
    secrets:
      api_token:
        description: 'Bearer token issued for this repo.'
        required: true

jobs:
  # Split on permissions, not time: `scan` handles untrusted repo contents with no token
  # scopes at all, `report` can write to the PR but never touches the checkout.
  scan:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      run-id: ${{ steps.post.outputs.run-id }}
    steps:
      - name: Checkout the calling repository
        uses: actions/checkout@v4

      - name: Fetch scan.sh
        # RUNNER_TEMP, not a second checkout: anything in the workspace gets scanned, so
        # the tooling would show up in the caller's own findings.
        env:
          SOURCE: https://raw.githubusercontent.com/${{ inputs.triage-repo }}/${{ inputs.triage-ref }}/services/security-triage/scan.sh
        run: |
          curl -sSfL "$SOURCE" -o "$RUNNER_TEMP/scan.sh"
          chmod +x "$RUNNER_TEMP/scan.sh"

      - name: Install the scanners
        run: |
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sudo sh -s -- -b /usr/local/bin
          python -m pip install --quiet --upgrade pip
          pip install --quiet bandit checkov

      - name: Scan
        # Absolute output path: scan.sh cd's into the scan directory.
        env:
          SCAN_PATH: ${{ inputs.scan-path }}
        run: '"$RUNNER_TEMP/scan.sh" "$SCAN_PATH" "$RUNNER_TEMP/envelope.json"'

      - name: POST the envelope
        id: post
        env:
          ENDPOINT: ${{ inputs.endpoint }}
          API_TOKEN: ${{ secrets.api_token }}
          RISK_THRESHOLD: ${{ inputs.risk-threshold }}
        run: |
          # scan.sh reads git, which in a pull_request checkout gives an origin URL and
          # the branch name "HEAD". The GitHub context wins.
          python3 - <<'PY'
          import json, os

          path = os.path.join(os.environ["RUNNER_TEMP"], "envelope.json")
          with open(path) as f:
              envelope = json.load(f)

          envelope["repo"] = os.environ["GITHUB_REPOSITORY"]
          envelope["commit"] = os.environ["GITHUB_SHA"]
          # HEAD_REF is the source branch; REF_NAME would be "123/merge".
          envelope["branch"] = (
              os.environ.get("GITHUB_HEAD_REF") or os.environ["GITHUB_REF_NAME"]
          )

          threshold = os.environ.get("RISK_THRESHOLD", "").strip()
          if threshold:
              envelope["risk_threshold"] = int(threshold)

          with open(path, "w") as f:
              json.dump(envelope, f)
          PY

          # --fail-with-body: plain --fail discards the detail string that says which.
          curl -sS --fail-with-body -X POST "$ENDPOINT/triage" \
            -H "Authorization: Bearer $API_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/envelope.json" \
            -o "$RUNNER_TEMP/accepted.json"

          cat "$RUNNER_TEMP/accepted.json"
          echo "run-id=$(jq -r .run_id "$RUNNER_TEMP/accepted.json")" >> "$GITHUB_OUTPUT"

  report:
    needs: scan
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Wait for the verdict
        env:
          ENDPOINT: ${{ inputs.endpoint }}
          API_TOKEN: ${{ secrets.api_token }}
          RUN_ID: ${{ needs.scan.outputs.run-id }}
          TIMEOUT_MINUTES: ${{ inputs.poll-timeout-minutes }}
        run: |
          deadline=$(( $(date +%s) + TIMEOUT_MINUTES * 60 ))
          while :; do
            curl -sS --fail-with-body -H "Authorization: Bearer $API_TOKEN" \
              "$ENDPOINT/triage/$RUN_ID" -o "$RUNNER_TEMP/run.json"
            status=$(jq -r .status "$RUNNER_TEMP/run.json")
            echo "run $RUN_ID: $status"
            [ "$status" = "pending" ] || break
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::triage run $RUN_ID was still pending after $TIMEOUT_MINUTES minutes"
              exit 1
            fi
            sleep 30
          done

      - name: Render the comment
        # Fetched, not inlined: it is the only output a human reads, it has real
        # branches, and as a module it has tests. Stdlib-only, so no pip install.
        env:
          SOURCE: https://raw.githubusercontent.com/${{ inputs.triage-repo }}/${{ inputs.triage-ref }}/services/security-triage/comment.py
        run: |
          curl -sSfL "$SOURCE" -o "$RUNNER_TEMP/comment.py"
          python3 "$RUNNER_TEMP/comment.py" "$RUNNER_TEMP/run.json" "$RUNNER_TEMP/comment.md"

      - name: Comment on the pull request
        if: github.event_name == 'pull_request'
        env:
          # The caller's token. The service never holds a credential for any repo.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          # -R is not optional: this job never checks the caller out, so gh has no git
          # remote to infer the repo from and dies with "not a git repository". Found on
          # the first real run, after the endpoint went live.
          REPO: ${{ github.repository }}
        run: |
          # --edit-last so a five-push PR carries one verdict, not five.
          gh pr comment "$PR" -R "$REPO" --body-file "$RUNNER_TEMP/comment.md" --edit-last \
            || gh pr comment "$PR" -R "$REPO" --body-file "$RUNNER_TEMP/comment.md"

      - name: Apply the gate
        run: |
          python3 - <<'PY'
          import json, os, sys

          with open(os.environ["RUNNER_TEMP"] + "/run.json") as f:
              run = json.load(f)

          if run["status"] == "failed":
              sys.exit(f"triage did not complete: {run['error']}")

          risk = run["risk"]
          print(f"score {risk['score']}, threshold {risk['threshold']}: {risk['verdict']}")
          if risk["verdict"] == "fail":
              sys.exit(
                  f"risk score {risk['score']} is at or above the threshold "
                  f"{risk['threshold']}"
              )
          PY
