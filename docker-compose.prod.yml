# Runs the published GHCR images instead of building from source.
#
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Standalone rather than an override: compose can add a key but cannot remove one, so
# layering this over docker-compose.yml would leave `build:` in place and rebuild.
#
# A fresh host needs the copilot's index populated once, before first start:
#   docker compose -f docker-compose.prod.yml run --rm knowledge-copilot python ingest.py
#
# All five services read the same root .env. See .env.example for every key.

services:
  log-analyzer:
    image: ghcr.io/crypticani/autonomous-infra-labs/log-analyzer:${LOG_ANALYZER_TAG:-latest}
    # A moving tag is not re-pulled just because it moved.
    pull_policy: always
    container_name: log-analyzer
    env_file:
      - .env
    command: ["uvicorn", "log_analyzer:app", "--host", "0.0.0.0", "--port", "${PORT:-7000}"]
    ports:
      - "${PORT:-7000}:${PORT:-7000}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:$PORT/health"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 10s

  knowledge-copilot:
    image: ghcr.io/crypticani/autonomous-infra-labs/knowledge-copilot:${KNOWLEDGE_COPILOT_TAG:-latest}
    pull_policy: always
    container_name: knowledge-copilot
    env_file:
      - .env
    # Single worker: two would race two alert-sync loops on the same writes.
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "${COPILOT_PORT:-7100}"]
    ports:
      # Loopback only; nginx terminates TLS on this host and proxies to it. Docker
      # publishes via nat/PREROUTING, ahead of any filter/INPUT rule, so the bind address
      # is the control that actually holds.
      - "127.0.0.1:${COPILOT_PORT:-7100}:${COPILOT_PORT:-7100}"
    # Bind mounts keep the host uid. Override in .env if `id -u` is not 1000.
    user: "${KC_UID:-1000}:${KC_GID:-1000}"
    volumes:
      - ./services/knowledge-copilot/corpus:/app/corpus:ro
      - ./services/knowledge-copilot/chroma_data:/app/chroma_data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:$COPILOT_PORT/health"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 10s

  self-healing-agent:
    image: ghcr.io/crypticani/autonomous-infra-labs/self-healing-agent:${SELF_HEALING_AGENT_TAG:-latest}
    pull_policy: always
    container_name: self-healing-agent
    env_file:
      - .env
    # --workers 1: approvals._proposals is in-process, so a second worker would answer
    # "expired or unknown" to a valid Slack Approve.
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "${SHA_PORT:-7200}", "--workers", "1"]
    ports:
      - "127.0.0.1:${SHA_PORT:-7200}:${SHA_PORT:-7200}"
    user: "${SHA_UID:-1000}:${SHA_GID:-1000}"
    environment:
      - KUBECONFIG=/home/appuser/.kube/config
    volumes:
      # The audit log is a safety control and has to outlive the container.
      - ./services/self-healing-agent/audit:/app/audit
      # A ServiceAccount token scoped to the sandbox namespace, not an admin kubeconfig.
      - ./services/self-healing-agent/.secrets/kubeconfig:/home/appuser/.kube/config:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:$SHA_PORT/health"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 10s

  security-triage:
    image: ghcr.io/crypticani/autonomous-infra-labs/security-triage:${SECURITY_TRIAGE_TAG:-latest}
    pull_policy: always
    container_name: security-triage
    env_file:
      - .env
    # --workers 1 for three reasons here: _runs holds verdicts, _starts holds rate-limit
    # buckets, and the Prometheus registry is per-process.
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "${ST_PORT:-7300}", "--workers", "1"]
    ports:
      - "127.0.0.1:${ST_PORT:-7300}:${ST_PORT:-7300}"
    # No user override and no volumes: nothing is bind-mounted, so the image's own uid
    # 10001 stands.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:$ST_PORT/health"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 10s

  gateway:
    image: ghcr.io/crypticani/autonomous-infra-labs/gateway:${GATEWAY_TAG:-latest}
    pull_policy: always
    container_name: gateway
    env_file:
      - .env
    # --workers 1: _starts holds the per-token rate-limit buckets and the Prometheus
    # registry is per-process. This service does no work heavy enough to want a second --
    # every request it serves is spent waiting on somebody else's socket.
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "${GW_PORT:-7500}", "--workers", "1"]
    ports:
      # Loopback only; nginx terminates TLS on this host and proxies to it.
      - "127.0.0.1:${GW_PORT:-7500}:${GW_PORT:-7500}"
    # No user override and no volumes: nothing is bind-mounted, so the image's own uid
    # 10001 stands.
    #
    # No depends_on either, deliberately. The gateway is correct with every backend down:
    # /ask still routes and still declines, and /health is the one endpoint that reports
    # which of the four is missing. Making it wait would delay exactly that.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:${GW_PORT:-7500}/health"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 10s
