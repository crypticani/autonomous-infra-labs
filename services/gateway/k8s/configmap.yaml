# Non-secret policy only. GW_API_TOKENS, the four backend tokens and GEMINI_API_KEY all
# come from a Secret; see deployment.yaml and the `kubectl create secret` line in Readme.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: gateway
data:
  GW_LLM_PROVIDER: "ollama"

  # `.invalid` is RFC 2606 reserved and never resolves, so a deploy that forgot to set
  # this fails loudly instead of routing against something unexpected.
  GW_OLLAMA_BASE_URL: "http://ollama-host.invalid:11434"

  # Fail-safe until eval_router.py says otherwise. An instruct tune rather than the coder
  # model triage runs: this call classifies prose about incidents.
  GW_OLLAMA_MODEL: "qwen2.5:7b-instruct"

  # 120, not triage's 600. This is the one model call a human waits on synchronously, so a
  # router that takes ten minutes is broken rather than slow.
  GW_LLM_TIMEOUT: "120"
  GW_MAX_TOKENS: "256"

  # Below this the gateway declines whatever the model named. Raise it to make the router
  # quieter and more often wrong-by-omission; lower it to make it guess.
  GW_MIN_CONFIDENCE: "0.6"

  # Fully-qualified cross-namespace DNS, because each backend lives in its own namespace.
  # A bare service name would resolve inside `gateway` and find nothing.
  GW_LOG_ANALYZER_URL: "http://log-analyzer.log-analyzer.svc.cluster.local:7000"
  GW_KNOWLEDGE_COPILOT_URL: "http://knowledge-copilot.knowledge-copilot.svc.cluster.local:7100"
  GW_SELF_HEALING_AGENT_URL: "http://self-healing-agent.self-healing-agent.svc.cluster.local:7200"
  GW_SECURITY_TRIAGE_URL: "http://security-triage.security-triage.svc.cluster.local:7300"

  # The copilot is the slowest of the four at 300s on CPU, and this has to clear it or the
  # gateway invents a timeout the backend would not have had.
  GW_BACKEND_TIMEOUT: "300"
  # Deliberately much shorter and a different number for a different job: /health serves
  # the kubelet probes, so a wedged backend must not hold it open.
  GW_HEALTH_TIMEOUT: "5"

  GW_MAX_ASKS_PER_HOUR: "60"

  LOG_LEVEL: "INFO"
