# Non-secret policy only. Tokens and keys come from a Secret; see deployment.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: gateway
data:
  GW_LLM_PROVIDER: "ollama"

  # `.invalid` never resolves, so a deploy that forgot this fails loudly.
  GW_OLLAMA_BASE_URL: "http://ollama-host.invalid:11434"

  # An instruct tune, not triage's coder model; set from eval_router.py.
  GW_OLLAMA_MODEL: "qwen2.5:7b-instruct"

  # 300, measured: 9s warm and 187s cold on the deployed host, almost all model load.
  GW_LLM_TIMEOUT: "300"
  GW_MAX_TOKENS: "256"

  # The lowest confidence level the gateway acts on: low, medium or high. "high" makes the
  # router quieter and more often wrong by omission; "low" disables the floor.
  GW_ROUTE_ON: "medium"

  # Fully-qualified: each backend lives in its own namespace.
  GW_LOG_ANALYZER_URL: "http://log-analyzer.log-analyzer.svc.cluster.local:7000"
  GW_KNOWLEDGE_COPILOT_URL: "http://knowledge-copilot.knowledge-copilot.svc.cluster.local:7100"
  GW_SELF_HEALING_AGENT_URL: "http://self-healing-agent.self-healing-agent.svc.cluster.local:7200"
  GW_SECURITY_TRIAGE_URL: "http://security-triage.security-triage.svc.cluster.local:7300"

  # Has to clear the copilot's own 300s or the gateway invents a timeout.
  GW_BACKEND_TIMEOUT: "300"
  # Shorter, and a separate knob: /health serves the kubelet probes.
  GW_HEALTH_TIMEOUT: "5"

  GW_MAX_ASKS_PER_HOUR: "60"

  LOG_LEVEL: "INFO"
