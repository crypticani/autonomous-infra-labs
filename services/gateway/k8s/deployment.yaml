apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: gateway
  labels:
    app: gateway
spec:
  # One replica is a constraint: the rate-limit buckets and the Prometheus registry are
  # process-local. Recreate, because RollingUpdate would briefly run two.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "7500"
        prometheus.io/path: "/metrics"
    spec:
      # CKV_K8S_38. This service never calls the Kubernetes API.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # Matches the numeric USER in the Dockerfile; a name fails runAsNonRoot.
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: ghcr.io/crypticani/autonomous-infra-labs/gateway:latest
          ports:
            - name: http
              containerPort: 7500
          envFrom:
            - configMapRef:
                name: gateway-config
          env:
            # Not optional: a missing Secret should fail the pod, not open the front door.
            - name: GW_API_TOKENS
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: GW_API_TOKENS
            # The tokens the gateway presents *to* the backends. Optional individually:
            # a backend with auth disabled needs none.
            - name: KC_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: KC_API_TOKEN
                  optional: true
            - name: SHA_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: SHA_API_TOKEN
                  optional: true
            - name: ST_API_TOKENS
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: ST_API_TOKENS
                  optional: true
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: GEMINI_API_KEY
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            # Lighter than the four behind it: one small model call, then waiting.
            limits:
              memory: "256Mi"
              cpu: "300m"
          volumeMounts:
            # readOnlyRootFilesystem needs somewhere writable for tempfiles.
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            # /health answers 200 while reporting `degraded`: every backend being down is
            # a normal state, and restarting this pod would not fix it. timeoutSeconds
            # clears GW_HEALTH_TIMEOUT, whose fan-out is concurrent.
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir: {}
