apiVersion: v1
kind: ConfigMap
metadata:
  name: log-analyzer-config
  labels:
    app: log-analyzer
data:
  LLM_PROVIDER: "ollama"
  # Environment-specific: whichever host runs Ollama, reachable from inside the cluster.
  # Set this before applying -- the placeholder fails loudly rather than silently.
  OLLAMA_BASE_URL: "http://OLLAMA_HOST_UNSET:11434"
  OLLAMA_MODEL: "qwen2.5-coder:3b"
  GEMINI_MODEL: "gemini-3.6-flash"
  LOG_LEVEL: "INFO"
