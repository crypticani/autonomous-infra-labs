# Scoped to the sandbox namespace and to exactly the verbs tools/ needs. test_rbac.py
# checks these rules against tools.REGISTRY's `needs` so the two cannot drift.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: self-healing-agent
  namespace: sandbox
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: self-healing-agent
  namespace: sandbox
rules:
  # get_pod_logs
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # restart_pod
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
  # get_recent_deploys
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["list"]
  # scale_deployment -- `get` is guardrails.py's execute-time check. The scale
  # subresource carries the replica count and nothing else.
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: self-healing-agent
  namespace: sandbox
subjects:
  - kind: ServiceAccount
    name: self-healing-agent
    namespace: sandbox
roleRef:
  kind: Role
  name: self-healing-agent
  apiGroup: rbac.authorization.k8s.io
