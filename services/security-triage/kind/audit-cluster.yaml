kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: audit
nodes:
  - role: control-plane
    # AUDIT_DIR is substituted for this directory's absolute path before `kind create`
    # runs (see the Readme's run sheet). Docker refuses the literal, which is the point.
    extraMounts:
      - hostPath: AUDIT_DIR/audit-policy.yaml
        containerPath: /etc/kubernetes/audit/policy.yaml
        readOnly: true
    # kubeadm v1beta4 takes extraArgs as a name/value list, not the map every older
    # example shows -- the map form silently fails to patch and the cluster comes up with
    # no audit log. `runtime-config` is kind's default, repeated so the merge keeps it.
    kubeadmConfigPatches:
      - |
        kind: ClusterConfiguration
        apiServer:
          extraArgs:
            - name: runtime-config
              value: ""
            - name: audit-policy-file
              value: /etc/kubernetes/audit/policy.yaml
            - name: audit-log-path
              value: /var/log/kubernetes/audit.log
            - name: audit-log-maxsize
              value: "20"
            - name: audit-log-maxbackup
              value: "1"
          extraVolumes:
            - name: audit-policy
              hostPath: /etc/kubernetes/audit/policy.yaml
              mountPath: /etc/kubernetes/audit/policy.yaml
              readOnly: true
              pathType: File
            - name: audit-log
              hostPath: /var/log/kubernetes
              mountPath: /var/log/kubernetes
              readOnly: false
              pathType: DirectoryOrCreate
