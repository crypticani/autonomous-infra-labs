apiVersion: audit.k8s.io/v1
kind: Policy
# Completed requests only. ResponseStarted fires again on the connection upgrade `exec`
# uses, which would count one shell session as two.
omitStages:
  - RequestReceived
  - ResponseStarted
rules:
  # Control-plane traffic first -- rules match in order, and the kubelet reads a Secret
  # for every token and image pull. Without this a human reading one is lost in the noise.
  #
  # ponytail: excluding the whole `system:serviceaccounts:kube-system` group is a blunt
  # instrument -- a compromised kube-system ServiceAccount is invisible here. Ceiling
  # accepted because the alternative is an unreadable log; upgrade path is naming the
  # individual controllers once there is a real cluster whose baseline is known.
  - level: None
    userGroups:
      - system:nodes
      - system:serviceaccounts:kube-system
  - level: None
    users:
      - system:apiserver
      - system:kube-scheduler
      - system:kube-controller-manager
      - system:kube-proxy

  # Metadata, never RequestResponse: the body of a Secret read or write *is* the secret,
  # so anything richer makes the audit log a plaintext copy of every credential.
  #
  # Wider than scanners.py's rule table judges -- volume is bounded here, meaning there.
  - level: Metadata
    resources:
      - group: ""
        resources:
          - pods/exec
          - pods/attach
          - pods/portforward
          - secrets
          - serviceaccounts/token
      - group: rbac.authorization.k8s.io
        resources:
          - roles
          - rolebindings
          - clusterroles
          - clusterrolebindings
