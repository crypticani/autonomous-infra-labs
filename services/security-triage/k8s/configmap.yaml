# Non-secret policy only. ST_API_TOKENS and GEMINI_API_KEY come from a Secret; see
# deployment.yaml and the `kubectl create secret` line in Readme.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: security-triage-config
  namespace: security-triage
data:
  ST_LLM_PROVIDER: "ollama"

  # `.invalid` is RFC 2606 reserved and never resolves, so a deploy that forgot to set
  # this fails loudly instead of triaging against something unexpected.
  OLLAMA_BASE_URL: "http://ollama-host.invalid:11434"

  ST_OLLAMA_MODEL: "qwen2.5-coder:7b"

  # Both set from Day 27's measurement; raising the batch size means raising the timeout.
  ST_BATCH_SIZE: "5"
  ST_LLM_TIMEOUT: "600"
  ST_MAX_TOKENS: "1536"

  # This deploy's default bar; callers override it per request with `risk_threshold`.
  ST_RISK_THRESHOLD: "40"

  LOG_LEVEL: "INFO"
