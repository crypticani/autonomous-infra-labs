apiVersion: apps/v1
kind: Deployment
metadata:
  name: security-triage
  namespace: security-triage
  labels:
    app: security-triage
spec:
  # One replica is a constraint, not a starting point: run records, rate-limit buckets
  # and the Prometheus registry are all process-local. Recreate, because RollingUpdate
  # would briefly run two.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: security-triage
  template:
    metadata:
      labels:
        app: security-triage
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "7300"
        prometheus.io/path: "/metrics"
    spec:
      # CKV_K8S_38. This service never calls the Kubernetes API.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # Matches the numeric USER in the Dockerfile; a name would leave the kubelet
        # unable to verify non-root and the pod would never start.
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: security-triage
          image: ghcr.io/crypticani/autonomous-infra-labs/security-triage:latest
          ports:
            - name: http
              containerPort: 7300
          envFrom:
            - configMapRef:
                name: security-triage-config
          env:
            # Not optional: without tokens this endpoint serves inference to anyone who
            # finds it, so a missing Secret should fail the pod rather than degrade it.
            - name: ST_API_TOKENS
              valueFrom:
                secretKeyRef:
                  name: security-triage-secrets
                  key: ST_API_TOKENS
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: security-triage-secrets
                  key: GEMINI_API_KEY
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            # readOnlyRootFilesystem with nowhere writable is how a Python service dies
            # on its first tempfile.
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            # /health answers 200 even when degraded, deliberately: an unreachable model
            # backend is a normal state here and surfaces as a failed run, not a pod to
            # pull out of service.
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir: {}
