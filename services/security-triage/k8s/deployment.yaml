apiVersion: apps/v1
kind: Deployment
metadata:
  name: security-triage
  namespace: security-triage
  labels:
    app: security-triage
spec:
  # One replica, and this is a constraint rather than a starting point. Run records
  # (`_runs`), rate-limit buckets (`_starts`) and the Prometheus registry are all
  # process-local, so a second replica would 404 on runs it never saw, allow double the
  # per-token rate limit, and export half the metrics on each scrape. Same reason the
  # Dockerfile pins --workers 1. Horizontal scale needs shared state first.
  replicas: 1
  # Recreate, not RollingUpdate: the default would briefly run the old and new pods
  # together, which is the two-replica problem above arriving during every deploy. The
  # cost is a few seconds of downtime on a service whose callers already poll and retry.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: security-triage
  template:
    metadata:
      labels:
        app: security-triage
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "7300"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        # Matches the numeric USER in the Dockerfile by construction -- see the comment
        # there. A name would leave the kubelet unable to verify non-root and the pod
        # would never start.
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: security-triage
          image: ghcr.io/crypticani/autonomous-infra-labs/security-triage:latest
          ports:
            - name: http
              containerPort: 7300
          envFrom:
            - configMapRef:
                name: security-triage-config
          env:
            # Not optional, unlike log-analyzer's key: without tokens this endpoint
            # serves CPU-minutes of somebody else's inference to anyone who finds it.
            # /health reports `auth: disabled` when it is empty, but a missing Secret
            # should fail the pod, not degrade it quietly.
            - name: ST_API_TOKENS
              valueFrom:
                secretKeyRef:
                  name: security-triage-secrets
                  key: ST_API_TOKENS
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: security-triage-secrets
                  key: GEMINI_API_KEY
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            # readOnlyRootFilesystem above with nowhere writable is how a Python service
            # dies on its first tempfile. Nothing here writes deliberately -- run records
            # are in memory and PYTHONDONTWRITEBYTECODE is set in the image -- but the
            # library floor under `requests` and `uvicorn` is not something to find out
            # about from a CrashLoopBackOff.
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            # /health answers 200 even when it reports `degraded`, and that is deliberate
            # rather than an oversight here: an unreachable model backend is a normal
            # state for this deploy (the laptop hosting Ollama is not always awake) and
            # it surfaces as a recorded `failed` run, not as a pod that should be pulled
            # out of service. The probe checks that the process is serving, nothing more.
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir: {}
